<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Harbor Summit Lisbon photos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
<style>
/* C: the event page exactly as the landing page shows it. The right column changes with the search:
   preview photos, then the dark scan panel from the landing demo, then your photos. */
.head { border-bottom: 1px solid var(--line); }
.head .wrap { display: flex; align-items: center; height: 64px; }
.head .logo { font-size: 1rem; }

.evpage { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); align-items: start; gap: clamp(28px, 5vw, 64px); padding-block: clamp(32px, 6vw, 72px); }
.count { color: var(--muted); }
h1 { margin: 8px 0 14px; font-size: clamp(2.2rem, 4.6vw, 3.6rem); }
.about { max-width: 44ch; color: var(--muted); }

.find { display: flex; align-items: center; gap: 14px; margin-top: clamp(24px, 3vw, 36px); padding: 14px; border: 2px dashed var(--dash); border-radius: 10px; line-height: 1.3; }
.find:has(.slot img) { border-style: solid; border-color: var(--line); }
.find .slot { width: 56px; height: 56px; }
.find-text { flex: 1; min-width: 0; }
.find-text b { display: block; font-weight: 800; font-stretch: 110%; }
.find-text span { display: block; margin-top: 2px; color: var(--muted); font-size: .92rem; }
.find .meter { margin-top: 8px; }
.find-actions { display: flex; flex-direction: column; gap: 12px; margin-top: 12px; }
.find-actions .btn { width: 100%; }
.find-actions .link-btn { align-self: center; }

.panel { border-radius: 12px; transition: background-color .4s, padding .4s; }
.panel-head { display: none; justify-content: space-between; gap: 12px; padding: 4px 6px 12px; line-height: 1.25; }
.panel-head b { display: block; font-size: 1.15rem; font-weight: 800; font-stretch: 110%; }
.panel-head span { display: block; color: #b8b8b2; font-size: .9rem; }
[data-state="searching"] .panel { padding: 12px; background: var(--ink); color: #fff; }
[data-state="searching"] .panel-head { display: flex; }
[data-state="searching"] .panel figcaption { display: none; }
.mosaic { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
.mosaic img { width: 100%; height: 100%; aspect-ratio: 4 / 3; object-fit: cover; border-radius: 4px; }
.mosaic img:first-child { grid-column: span 2; grid-row: span 2; }
.panel figcaption { margin-top: 10px; color: var(--muted); font-size: .9rem; }
[data-state="found"] .panel { display: none; }

.results-head { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 12px 16px; margin-bottom: 18px; }
.results h2 { font-size: clamp(1.8rem, 3.4vw, 2.6rem); }
.results-head p { margin-top: 6px; color: var(--muted); }
.results .matches { grid-template-columns: repeat(2, minmax(0, 1fr)); }
@media (max-width: 860px) {
  .evpage { grid-template-columns: 1fr; }
  .panel { order: -1; }
}
.foot { padding-block: 32px 48px; border-top: 1px solid var(--line); color: var(--muted); font-size: .9rem; }
.foot a { color: var(--ink); font-weight: 700; }
</style>
</head>
<body>
<header class="head"><div class="wrap"><a class="logo" href="#">FindPhotosOfMe</a></div></header>

<main class="wrap evpage">
  <div>
    <p class="count">5,214 photos</p>
    <h1>Harbor Summit Lisbon</h1>
    <p class="about">Photos from both days of Harbor Summit, May 14 and 15 at the Lisbon Congress Centre. Taken by Lumen Studio.</p>
    <div class="find" aria-live="polite">
      <div class="slot" id="slot"></div>
      <div class="find-text">
        <b id="find-title"></b>
        <span id="find-text"></span>
        <div class="meter" id="meter" hidden><i></i></div>
      </div>
    </div>
    <div class="find-actions" id="find-actions"></div>
    <input type="file" id="selfie" accept="image/*" class="sr" tabindex="-1">
  </div>

  <figure class="panel">
    <div class="panel-head" aria-hidden="true">
      <p><b>Looking for your photos</b><span id="panel-count"></span></p>
    </div>
    <div class="mosaic sweep" id="previews"></div>
    <figcaption>A few of the 5,214 photos</figcaption>
  </figure>

  <section class="results" id="results" hidden>
    <div class="results-head">
      <div>
        <h2>8 photos of you</h2>
        <p>Tap a photo to download it.</p>
      </div>
      <a class="btn btn-sm" href="#"><i data-icon="download"></i>Download all 8</a>
    </div>
    <ul class="matches" id="matches"></ul>
  </section>
</main>

<footer class="foot"><div class="wrap">Photo search by <a href="index.html">FindPhotosOfMe</a></div></footer>

<script src="app.js"></script>
<script>
const $ = (id) => document.getElementById(id);
$("previews").innerHTML = PREVIEWS.slice(0, 6).map((name) => `<img src="${photo(name)}" alt="">`).join("");
hydrateIcons();

const COPY = {
  start: ["Find your photos", "Add a selfie to see the photos you’re in."],
  selfie: ["Your selfie is added", `We’ll look for you in all ${fmt(EVENT.total)} photos.`],
  searching: ["Looking for you", "Keep this page open until it finishes."],
  found: ["Searched with this selfie", "Not the photos you expected? Try a different selfie."],
  none: ["No photos of you found", "Try a selfie with one face, looking at the camera, in good light."],
  error: ["No face found in this photo", "Use a photo where your face is clear and looking at the camera."],
};
const ACTIONS = {
  start: `<button class="btn" data-do="pick">${icon("camera")}Add a selfie</button>`,
  selfie: `<button class="btn" data-do="search">Find my photos</button><button class="link-btn" data-do="pick">Use a different selfie</button>`,
  searching: "",
  found: `<button class="btn btn-line" data-do="pick">Try another selfie</button>`,
  none: `<button class="btn" data-do="pick">Try another selfie</button>`,
  error: `<button class="btn" data-do="pick">Choose another photo</button>`,
};

const mark = protoBar("Event page C: as on the landing page", SEARCH_STATES, (state) => search.jump(state));
let shown;
function render(s) {
  const progress = `${fmt(s.checked)} of ${fmt(EVENT.total)} checked, ${s.found} found`;
  $("panel-count").textContent = progress;
  $("meter").firstElementChild.style.setProperty("--p", `${(s.checked / EVENT.total) * 100}%`);
  if (s.state === shown) return;
  shown = s.state;
  mark(s.state);
  $("find-title").textContent = COPY[s.state][0];
  $("find-text").textContent = COPY[s.state][1];
  $("find-actions").innerHTML = ACTIONS[s.state];
  $("slot").innerHTML = s.selfie ? `<img src="${s.selfie}" alt="Your selfie">` : icon("camera");
  $("meter").hidden = s.state !== "searching";
  $("results").hidden = s.state !== "found";
  $("matches").innerHTML = s.state === "found" ? matchTiles() : "";
}
const search = createSearch(render);

document.addEventListener("click", (e) => {
  const action = e.target.closest("[data-do]")?.dataset.do;
  if (action === "pick") $("selfie").click();
  if (action === "search") search.search();
});
$("selfie").addEventListener("change", (e) => search.pickFile(e.target));
</script>
</body>
</html>
